/* ============================================================
   Firebase Backend - Auth + Firestore Cloud Database
   Replaces localStorage with cloud persistence
   ============================================================ */
var FirebaseBackend = {
  app: null,
  auth: null,
  db: null,
  initialized: false,
  userId: null,

  // Initialize Firebase (call once on page load)
  init(firebaseConfig) {
    if (this.initialized) return;

    try {
      // Firebase v9+ compat mode (loaded via CDN)
      this.app = firebase.initializeApp(firebaseConfig);
      this.auth = firebase.auth();
      // Persist login across browser restarts (LOCAL = survives tab/browser close)
      this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      this.db = firebase.firestore();

      // Enable offline persistence
      this.db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code === 'failed-precondition') {
          console.warn('Firestore persistence: multiple tabs open');
        } else if (err.code === 'unimplemented') {
          console.warn('Firestore persistence: browser not supported');
        }
      });

      // Listen for auth state changes
      this.auth.onAuthStateChanged(user => {
        if (user) {
          this.userId = user.uid;
          const userData = {
            uid: user.uid,
            displayName: user.displayName,
            email: user.email,
            photoURL: user.photoURL
          };
          store.update({ user: userData, isAuthenticated: true });

          // Update sidebar user info
          const avatarEl = document.getElementById('user-avatar');
          const nameEl = document.getElementById('user-name');
          if (avatarEl) {
            if (user.photoURL) {
              avatarEl.innerHTML = `<img src="${user.photoURL}" alt="">`;
            } else {
              avatarEl.textContent = (user.displayName || user.email || '?')[0];
            }
          }
          if (nameEl) nameEl.textContent = user.displayName || user.email;

          // Load user data from Firestore
          this.loadAllData();

          // Navigate to appropriate page
          if (app.currentPage === 'login') {
            const disease = store.get('selectedDisease');
            app.navigate(disease ? 'dashboard' : 'disease-select');
          }
        } else {
          this.userId = null;
          store.update({ user: null, isAuthenticated: false });
          app.navigate('login');
        }
      });

      this.initialized = true;
      console.log('Firebase initialized');
    } catch (err) {
      console.error('Firebase init failed:', err);
      Components.showToast('Firebase初期化エラー: ' + err.message, 'error');
    }
  },

  // ---- Authentication ----
  async signInWithGoogle() {
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      const result = await this.auth.signInWithPopup(provider);
      Components.showToast(`${result.user.displayName || result.user.email} でログインしました`, 'success');
      return result.user;
    } catch (err) {
      if (err.code === 'auth/popup-closed-by-user') return null;
      Components.showToast('Googleログインエラー: ' + err.message, 'error');
      throw err;
    }
  },

  async signInWithEmail(email, password) {
    try {
      // Try sign in first, if fails try create account
      try {
        const result = await this.auth.signInWithEmailAndPassword(email, password);
        Components.showToast('ログインしました', 'success');
        return result.user;
      } catch (err) {
        if (err.code === 'auth/user-not-found') {
          const result = await this.auth.createUserWithEmailAndPassword(email, password);
          Components.showToast('アカウントを作成しました', 'success');
          return result.user;
        }
        throw err;
      }
    } catch (err) {
      Components.showToast('ログインエラー: ' + err.message, 'error');
      throw err;
    }
  },

  async signOut() {
    try {
      await this.auth.signOut();
      store.clearAll();
      Components.showToast('ログアウトしました', 'info');
    } catch (err) {
      Components.showToast('ログアウトエラー: ' + err.message, 'error');
    }
  },

  // ---- Firestore Data Operations ----

  // Get reference to user's document collection
  userDoc() {
    if (!this.userId) throw new Error('Not authenticated');
    return this.db.collection('users').doc(this.userId);
  },

  userCollection(name) {
    return this.userDoc().collection(name);
  },

  // Save a single key-value to user profile
  async saveProfile(data) {
    try {
      await this.userDoc().set(data, { merge: true });
    } catch (err) {
      console.error('Save profile error:', err);
    }
  },

  // Save health data entry to a subcollection
  async saveHealthEntry(collection, entry) {
    try {
      const docRef = await this.userCollection(collection).add({
        ...entry,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return docRef.id;
    } catch (err) {
      console.error('Save entry error:', err);
      return null;
    }
  },

  // Save text entry
  async saveTextEntry(entry) {
    return await this.saveHealthEntry('textEntries', entry);
  },

  // Save conversation message
  async saveConversation(message) {
    return await this.saveHealthEntry('conversations', message);
  },

  // Save settings (selected disease, model, prompts, affiliate config)
  async saveSettings(settings) {
    await this.saveProfile({ settings });
  },

  // Save API keys (encrypted in Firestore, not in localStorage)
  async saveApiKeys(keys) {
    // Store in a separate secured subcollection
    try {
      await this.userDoc().collection('secrets').doc('apikeys').set(keys);
      Components.showToast('APIキーをクラウドに保存しました', 'success');
    } catch (err) {
      console.error('Save API keys error:', err);
      Components.showToast('APIキー保存エラー', 'error');
    }
  },

  async loadApiKeys() {
    try {
      const doc = await this.userDoc().collection('secrets').doc('apikeys').get();
      return doc.exists ? doc.data() : {};
    } catch (err) {
      console.error('Load API keys error:', err);
      return {};
    }
  },

  // ---- Batch Load All User Data ----
  async loadAllData() {
    if (!this.userId) return;

    try {
      // Load user profile
      const profileDoc = await this.userDoc().get();
      if (profileDoc.exists) {
        const profile = profileDoc.data();
        if (profile.settings?.selectedDisease) store.set('selectedDisease', profile.settings.selectedDisease);
        if (profile.settings?.selectedModel) store.set('selectedModel', profile.settings.selectedModel);
        if (profile.settings?.customPrompts) store.set('customPrompts', profile.settings.customPrompts);
        if (profile.settings?.affiliateConfig) store.set('affiliateConfig', profile.settings.affiliateConfig);
        if (profile.settings?.dashboardLayout) store.set('dashboardLayout', profile.settings.dashboardLayout);
      }

      // Load collections in parallel
      const collections = {
        textEntries: 'textEntries',
        symptoms: 'symptoms',
        vitals: 'vitals',
        sleepData: 'sleep',
        activityData: 'activity',
        bloodTests: 'bloodTests',
        medications: 'medications',
        conversations: 'conversationHistory'
      };

      const loadPromises = Object.entries(collections).map(async ([storeKey, fbCollection]) => {
        try {
          const snapshot = await this.userCollection(fbCollection)
            .orderBy('createdAt', 'desc')
            .limit(500)
            .get();
          const data = [];
          snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
          data.reverse(); // chronological order
          store.set(storeKey, data);
        } catch (err) {
          // Collection might not exist yet
          console.warn(`Load ${fbCollection}:`, err.message);
        }
      });

      await Promise.all(loadPromises);

      // Load API keys
      const apiKeys = await this.loadApiKeys();
      if (apiKeys.anthropic) localStorage.setItem('apikey_anthropic', apiKeys.anthropic);
      if (apiKeys.openai) localStorage.setItem('apikey_openai', apiKeys.openai);
      if (apiKeys.google) localStorage.setItem('apikey_google', apiKeys.google);

      store.calculateHealthScore();
      console.log('All user data loaded from Firestore');
    } catch (err) {
      console.error('Load all data error:', err);
    }
  },

  // ---- Sync store changes to Firestore ----
  enableAutoSync() {
    // Watch for text entries
    store.on('textEntries', (entries) => {
      if (!this.userId || !entries?.length) return;
      const latest = entries[entries.length - 1];
      if (latest && !latest._synced) {
        this.saveHealthEntry('textEntries', latest);
        latest._synced = true;
      }
    });

    // Watch for symptom data
    store.on('symptoms', (entries) => {
      if (!this.userId || !entries?.length) return;
      const latest = entries[entries.length - 1];
      if (latest && !latest._synced) {
        this.saveHealthEntry('symptoms', latest);
        latest._synced = true;
      }
    });

    // Watch for vitals
    store.on('vitals', (entries) => {
      if (!this.userId || !entries?.length) return;
      const latest = entries[entries.length - 1];
      if (latest && !latest._synced) {
        this.saveHealthEntry('vitals', latest);
        latest._synced = true;
      }
    });

    // Watch for settings changes
    ['selectedDisease', 'selectedModel', 'customPrompts', 'affiliateConfig', 'dashboardLayout'].forEach(key => {
      store.on(key, (value) => {
        if (!this.userId) return;
        this.saveProfile({ settings: { [key]: value } });
      });
    });

    // Watch for analysis history
    store.on('latestAnalysis', (analysis) => {
      if (!this.userId || !analysis) return;
      this.saveHealthEntry('analyses', {
        timestamp: analysis.timestamp,
        model: analysis.model,
        promptName: analysis.promptName,
        summary: analysis.parsed?.summary || '',
      });
    });
  },

  // Check if Firebase is configured
  isConfigured() {
    const cfg = this.getConfig();
    return cfg && cfg.apiKey && cfg.apiKey !== 'YOUR_FIREBASE_API_KEY';
  },

  // Get Firebase config from CONFIG or localStorage
  getConfig() {
    const stored = localStorage.getItem('firebase_config');
    if (stored) {
      try { return JSON.parse(stored); } catch {}
    }
    return CONFIG.FIREBASE;
  },

  saveConfig(config) {
    localStorage.setItem('firebase_config', JSON.stringify(config));
  }
};

/* ============================================================
   Main Application Controller
   ============================================================ */
var App = class App {
  constructor() {
    this.pages = {};
    this.currentPage = null;
    this.chartInstances = {};
    this.ADMIN_EMAILS = ['agewaller@gmail.com'];
    // Load additional admins from localStorage
    try {
      const extra = JSON.parse(localStorage.getItem('admin_emails') || '[]');
      if (Array.isArray(extra)) this.ADMIN_EMAILS = [...new Set([...this.ADMIN_EMAILS, ...extra])];
    } catch(e) {}
  }

  isAdmin() {
    const user = store.get('user');
    return user && this.ADMIN_EMAILS.includes(user.email);
  }

  init() {
    // Force light theme always
    document.documentElement.removeAttribute('data-theme');
    localStorage.removeItem('cc_theme');
    store.on('currentPage', (p) => this.navigate(p));

    // Initialize Firebase if configured
    if (FirebaseBackend.isConfigured()) {
      const config = FirebaseBackend.getConfig();
      FirebaseBackend.init(config);
      FirebaseBackend.enableAutoSync();
      // Firebase auth will handle navigation via onAuthStateChanged
    } else {
      // No Firebase - use localStorage mode
      if (store.get('isAuthenticated') && store.get('user')) {
        this.navigate(store.get('selectedDisease') ? 'dashboard' : 'disease-select');
      } else {
        this.navigate('login');
      }
    }

    // Set up periodic health score calc
    setInterval(() => store.calculateHealthScore(), 60000);
    store.calculateHealthScore();

    // Load initial calendar data if not yet synced
    if (!(store.get('calendarEvents') || []).length) {
      store.set('calendarEvents', [
        {id:'e1',title:'IOEA 2026',location:'Cargèse, Corsica – France',start:'2026-04-06',end:'2026-04-11',allDay:true,type:'default',attendees:1},
        {id:'e2',title:'♻️資源ごみをすてる（上原）',start:'2026-04-06T06:30:00+09:00',end:'2026-04-06T07:00:00+09:00',allDay:false,type:'default',attendees:1},
        {id:'e3',title:'Reservation at APONTE',location:'APONTE, 目黒区',start:'2026-04-09T19:00:00+09:00',end:'2026-04-09T20:00:00+09:00',allDay:false,type:'default',attendees:1},

    if (['admin', 'analysis'].includes(page) && !this.isAdmin()) {
      Components.showToast('この機能は管理者専用です', 'error');
      return;
    }

    this.currentPage = page;
    const content = document.getElementById('page-content');
    const sidebar = document.getElementById('sidebar');
    const topbar = document.getElementById('top-bar');
    if (!content) return;

    // Hide admin-only nav items for non-admin users
    document.querySelectorAll('.admin-only').forEach(el => {
      el.style.display = this.isAdmin() ? '' : 'none';
    });

    // Show/hide sidebar for login/disease-select
    if (['login', 'disease-select'].includes(page)) {
      if (sidebar) sidebar.style.display = 'none';
      if (topbar) topbar.style.display = 'none';
      document.querySelector('.main-content').style.marginLeft = '0';

      if (sidebar) sidebar.style.display = '';

    document.querySelectorAll('.nav-item').forEach(el => {

    const fields = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];

    let filled = 0;
    fields.forEach(f => {
      const el = document.getElementById('fb-' + f);
      if (el && el.value.trim()) {
        config[f] = el.value.trim();
        filled++;
      }

    ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach(f => {
      const el = document.getElementById('fb-' + f);

      const diseases = store.get('selectedDiseases') || [];
      if (!diseases.includes('custom')) diseases.push('custom');
      store.set('selectedDiseases', diseases);
      store.set('customDiseaseName', customInput.value.trim());
    }

    // Ensure primary disease is set
    const diseases = store.get('selectedDiseases') || [];
    if (diseases.length > 0 && !store.get('selectedDisease')) {
      for (const cat of CONFIG.DISEASE_CATEGORIES) {
        const found = cat.diseases.find(d => d.id === diseases[0]);
        if (found) {
          store.set('selectedDisease', { id: found.id, name: found.name, fullName: found.name, icon: cat.icon, color: '#6C63FF' });
          break;
        }
      }
    }

    // Default to ME/CFS if nothing selected
    if (!store.get('selectedDisease')) {
      store.set('selectedDisease', { id: 'mecfs', name: 'ME/CFS', fullName: '筋痛性脳脊髄炎/慢性疲労症候群', icon: '🧠', color: '#6C63FF' });
    }

    // Load default prompts
    if (!store.get('customPrompts') || Object.keys(store.get('customPrompts')).length === 0) {
      store.set('customPrompts', { ...DEFAULT_PROMPTS });
    }

    Components.showToast(`${email} でログインしました（${diseases.length}疾患選択）`, 'success');
    this.navigate('dashboard');
  }

  async loginWithEmail(e) {
    if (e) e.preventDefault();
    const form = e.target;
    const email = form.querySelector('[name=email]').value;
    const pass = form.querySelector('[name=password]').value;
    if (!email || !pass) { Components.showToast('メールとパスワードを入力してください', 'error'); return; }

    if (FirebaseBackend.initialized) {
      try {
        await FirebaseBackend.signInWithEmail(email, pass);
      } catch (err) { /* error shown in signInWithEmail */ }
    } else {
      const user = { uid: 'local_' + Date.now(), displayName: email.split('@')[0], email, photoURL: null };
      store.update({ user, isAuthenticated: true });
      Components.showToast('ログインしました（ローカルモード）', 'success');
      this.navigate('disease-select');
    }

    if (FirebaseBackend.initialized) {
      await FirebaseBackend.signOut();
    } else {
      store.update({ user: null, isAuthenticated: false, currentPage: 'login' });
    }
    this.navigate('login');

  // ---- Disease Selection ----
  // ---- Disease Selection (multi-select) ----
  toggleDiseaseSelection(checkbox) {
    const selected = store.get('selectedDiseases') || [];
    const id = checkbox.value;

    if (checkbox.checked) {
      if (!selected.includes(id)) selected.push(id);
    } else {
      const idx = selected.indexOf(id);
      if (idx >= 0) selected.splice(idx, 1);
    }

    store.set('selectedDiseases', selected);

    // Update count badge
    const countEl = document.getElementById('disease-count');
    if (countEl) countEl.textContent = selected.length + '件選択中';

    // Show/hide custom input
    if (id === 'custom') {
      const customInput = document.getElementById('custom-disease-name');
      if (customInput) customInput.style.display = checkbox.checked ? 'block' : 'none';
    }

    // Also set primary disease for backward compat
    if (selected.length > 0) {
      const primaryId = selected[0];
      // Find disease name from categories
      let primaryDisease = null;
      for (const cat of CONFIG.DISEASE_CATEGORIES) {
        const found = cat.diseases.find(d => d.id === primaryId);
        if (found) {
          primaryDisease = { id: found.id, name: found.name, fullName: found.name, icon: cat.icon, color: '#6C63FF' };
          break;
        }
      }
      if (primaryDisease) store.set('selectedDisease', primaryDisease);
    }
  }

  selectDisease(diseaseId) {
    // Legacy single-select support
    const disease = CONFIG.DISEASES.find(d => d.id === diseaseId);
    if (disease) {
      store.set('selectedDisease', disease);
      store.set('selectedDiseases', [diseaseId]);
      if (!store.get('customPrompts') || Object.keys(store.get('customPrompts')).length === 0) {
        store.set('customPrompts', { ...DEFAULT_PROMPTS });
      }
      Components.showToast(`${disease.name} を選択しました`, 'success');

  openDataInput(category) {

    if (!overlay || !body) return;

  }

  submitDataForm(e, category) {
    e.preventDefault();
    const form = e.target;
    const data = {};
    new FormData(form).forEach((val, key) => {
      data[key] = isNaN(val) ? val : Number(val);
    });
    // Handle checkboxes
    form.querySelectorAll('input[type=checkbox]').forEach(cb => {
      data[cb.name] = cb.checked;
    });

    store.addHealthData(category, data);
    store.calculateHealthScore();

    this.closeModal();
    if (this.currentPage === 'dashboard') this.navigate('dashboard');

  handlePhotoUpload(e, category) {
    const files = e.target.files;
    if (files.length > 0) this.previewFiles(files, category);
  }

  handlePhotoDrop(e, category) {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (files.length > 0) this.previewFiles(files, category);
  }

  // Store pending files for preview before save
  _pendingFiles = [];

  previewFiles(files, category) {
    const preview = document.getElementById(`photo-preview-${category}`);
    if (!preview) return;

    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const fileData = {
          file: file,
          filename: file.name,
          type: file.type,
          size: file.size,
          dataUrl: ev.target.result,
          category: category
        };
        this._pendingFiles.push(fileData);

        // Show preview
        const isImage = file.type.startsWith('image/');
        preview.innerHTML += `
          <div style="position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg-tertiary)">
            ${isImage
              ? `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">`
              : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:24px">📄</div>`}
            <div style="position:absolute;bottom:0;left:0;right:0;padding:4px 6px;background:rgba(0,0,0,0.7);font-size:10px;color:#fff">${file.name} (${(file.size/1024).toFixed(0)}KB)</div>
          </div>`;

        // Show/update save button
        this.showFileSaveButton(category);
      };
      reader.readAsDataURL(file);
    });
  }

  showFileSaveButton(category) {
    let btnArea = document.getElementById('file-save-area');
    if (!btnArea) {
      const preview = document.getElementById(`photo-preview-${category}`);
      if (!preview) return;
      btnArea = document.createElement('div');
      btnArea.id = 'file-save-area';
      btnArea.style.cssText = 'margin-top:16px;display:flex;gap:10px;align-items:center';
      preview.parentElement.appendChild(btnArea);
    }
    btnArea.innerHTML = `
      <button class="btn btn-primary" onclick="app.saveUploadedFiles()">
        ${this._pendingFiles.length}件を保存してAI分析
      </button>
      <button class="btn btn-secondary" onclick="app.clearPendingFiles('${category}')">クリア</button>
      <span style="font-size:12px;color:var(--text-muted)">${this._pendingFiles.length}件のファイル待機中</span>
    `;
  }

  clearPendingFiles(category) {
    this._pendingFiles = [];
    const preview = document.getElementById(`photo-preview-${category}`);
    if (preview) preview.innerHTML = '';
    const btnArea = document.getElementById('file-save-area');
    if (btnArea) btnArea.remove();
  }

  async saveUploadedFiles() {
    if (this._pendingFiles.length === 0) {
      Components.showToast('保存するファイルがありません', 'error');
      return;
    }

    const btnArea = document.getElementById('file-save-area');
    if (btnArea) btnArea.innerHTML = Components.loading('保存＆分析中...');

    const savedEntries = [];
    const textForAnalysis = [];

    for (const fileData of this._pendingFiles) {
      // Try auto-import (XML, CSV, JSON, TXT)
      if (!fileData.type.startsWith('image/')) {
        try {
          const count = await Integrations.importFile(fileData.file);
          if (count > 0) {
            textForAnalysis.push(`[ファイル取込] ${fileData.filename}: ${count}件のデータ`);
            continue;
          }
        } catch (e) { /* fall through to generic save */ }
      }

      // Save image/generic file as health data
      const entry = store.addHealthData('photos', {
        filename: fileData.filename,
        type: fileData.type,
        size: fileData.size,
        dataUrl: fileData.type.startsWith('image/') ? fileData.dataUrl : fileData.dataUrl.substring(0, 200) + '...',
        category: fileData.category
      });
      savedEntries.push(entry);

      // For images, add to AI context
      if (fileData.type.startsWith('image/')) {
        textForAnalysis.push(`[写真アップロード] ${fileData.filename} (${fileData.category}): ${fileData.type}, ${(fileData.size/1024).toFixed(0)}KB`);
      }
    }

    // Save to conversation history for AI context
    if (textForAnalysis.length > 0) {
      const history = store.get('conversationHistory') || [];
      history.push({
        role: 'user',
        content: textForAnalysis.join('\n'),
        timestamp: new Date().toISOString(),
        type: 'file_upload'
      });
      store.set('conversationHistory', history);
    }

    // Sync to Firestore
    if (FirebaseBackend.initialized) {
      for (const entry of savedEntries) {
        await FirebaseBackend.saveHealthEntry('photos', entry);
      }
    }

    const totalCount = this._pendingFiles.length;
    this._pendingFiles = [];

    Components.showToast(`${totalCount}件のファイルを保存しました`, 'success');

    // Generate deep analysis for uploaded content
    const adviceText = textForAnalysis.join('\n');
    if (adviceText) {
      const analysis = this.generateDeepAnalysis(adviceText);
      store.set('latestFeedback', analysis);
    }

    // Re-render to show analysis
    if (this.currentPage === 'dashboard') this.navigate('dashboard');
    else if (this.currentPage === 'data-input') this.navigate('data-input');
  }

  generateFileAdvice(summary) {
    const lower = summary.toLowerCase();
    const alerts = [];
    let text = '';

    if (/血液検査|blood|検査結果/.test(lower)) {
      alerts.push({ level: 'info', message: '血液検査データを検出しました。分析ページで詳細な分析を実行できます。' });
      text += '【血液検査データ】アップロードされた検査結果をAI分析に使用します。管理パネルでAPIキーを設定すると、数値の解釈と推奨アクションが自動生成されます。\n\n';
    }

    if (/食事|meal|料理|ごはん|ランチ|ディナー/.test(lower)) {
      text += '【食事写真】食事内容を自動分析し、栄養バランスや抗炎症食の観点からアドバイスを生成します。\n\n';
    }

    if (/処方|薬|prescription|お薬手帳/.test(lower)) {
      alerts.push({ level: 'warning', message: '処方関連データを検出。薬の飲み合わせ確認のためAI分析を実行してください。' });
      text += '【処方データ】処方内容をAIが読み取り、飲み合わせや副作用リスクを確認します。\n\n';
    }

    if (/遺伝子|genetic|dna|snp/.test(lower)) {
      text += '【遺伝子データ】SNPデータや遺伝子検査結果は、薬剤代謝や疾患リスクの個別化分析に使用されます。\n\n';
    }

    if (/csv|json|xml/.test(lower)) {
      text += '【構造化データ】ファイルを自動解析し、適切なカテゴリに分類して保存しました。\n\n';
    }

    if (text === '') {
      text = 'ファイルを保存しました。このデータはAI分析のコンテキストに追加され、次回の分析で反映されます。より詳細な分析にはAI分析ページから分析を実行してください。';
    }

    text += '\n→ 分析ページで「ME/CFS 日次分析」を実行すると、すべてのアップロードデータを含めた総合分析が行えます。';

    return { alerts, text };
  }

  submitTextEntry() {
    const category = document.getElementById('text-input-category')?.value || 'other';
    const title = document.getElementById('text-input-title')?.value?.trim() || '';
    const content = document.getElementById('text-input-content')?.value?.trim() || '';
    const dateStr = document.getElementById('text-input-date')?.value || '';

    if (!content) {
      Components.showToast('内容を入力してください', 'error');
      return;
    }

    const timestamp = dateStr ? new Date(dateStr + 'T12:00:00').toISOString() : new Date().toISOString();

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).substr(2),
      timestamp: timestamp,
      category: category,
      type: 'text_entry',
      title: title,
      content: content
    };

    // Store in conversation history for AI context
    const history = store.get('conversationHistory') || [];
    history.push({
      role: 'user',
      content: `[${category}] ${title ? title + ': ' : ''}${content}`,
      timestamp: entry.timestamp,
      type: 'data_entry'
    });
    store.set('conversationHistory', history);

    // Always store in textEntries for AI analysis
    const textEntries = store.get('textEntries') || [];
    textEntries.push(entry);
    store.set('textEntries', textEntries);

    // Also store as health data in the appropriate category
    const stateKey = store.categoryToStateKey(category);
    if (stateKey && Array.isArray(store.get(stateKey))) {
      store.addHealthData(category, { text_note: content, title: title });
    }

    // Clear form
    document.getElementById('text-input-content').value = '';
    document.getElementById('text-input-title').value = '';

    // Generate deep analysis and save
    const analysis = this.generateDeepAnalysis(content);
    store.set('latestFeedback', analysis);

    // Navigate to dashboard to show analysis
    this.navigate('dashboard');

    // Run API analysis in background if available
    const apiKey = aiEngine.getApiKey(store.get('selectedModel'));
    if (apiKey) {
      setTimeout(() => this.runBackgroundAnalysis(content, document.getElementById('dash-ai-feedback')), 500);
    }

    Components.showToast('保存しました', 'success');
  }

              </div>

          </div>
        </div>`;

      const status = document.getElementById('text-save-status');
      if (status) status.textContent = 'AI分析完了';
    }, 300);
  }

          actions.push('入浴で一日をリセットする');
        }
      }

      advice += '改善（かいぜん）：小さな記録の積み重ねが、大きな変化をもたらします。';
    }

    // Ensure at least one action
    if (actions.length === 0) {
      actions.push('次の体調変化時にも記録する');
    }

    // Add streak/motivation message
    const totalEntries = (store.get('textEntries') || []).length;
    if (totalEntries > 0 && totalEntries % 7 === 0) {
      alerts.unshift({ level: 'info', message: `${totalEntries}件目の記録です！継続は力なり。データが蓄積されるほど分析精度が向上します。` });
    } else if (totalEntries === 1) {
      alerts.unshift({ level: 'info', message: '最初の記録です！毎日続けると、体調パターンが見えてきます。' });
    }

    return { text: advice, alerts, actions };
  }

  // ---- AI Analysis ----
  async runAnalysis(promptKey) {
    const prompts = { ...DEFAULT_PROMPTS, ...(store.get('customPrompts') || {}) };
    const promptConfig = prompts[promptKey] || Object.values(prompts)[0];

    }

        const c = a.level === 'warning' ? 'var(--warning)' : 'var(--info)';
        html += `<div style="padding:12px 16px;background:${c}15;border-left:3px solid ${c};border-radius:0 8px 8px 0;margin-bottom:8px;font-size:13px;color:var(--text-primary)">${a.message}</div>`;
      });
      html += '</div>';
    }

    // Trends
    if (p.trends) {
      html += '<div class="grid grid-4" style="margin-bottom:20px">';
      const trendLabels = { fatigue: '疲労', pain: '痛み', sleep: '睡眠', cognitive: '認知機能' };
      const trendIcons = { fatigue: '😴', pain: '💢', sleep: '🌙', cognitive: '🧠' };
      Object.entries(p.trends).forEach(([k, v]) => {
        const dir = v.direction === 'improving' ? '改善↑' : v.direction === 'declining' ? '悪化↓' : '安定→';
        const cls = v.direction === 'improving' ? 'positive' : v.direction === 'declining' ? 'negative' : '';
        html += Components.statCard(trendLabels[k] || k, `${trendIcons[k] || ''} ${dir}`, v.change ? v.change * 100 : 0);
      });
      html += '</div>';
    }

    // Recommendations
    if (p.recommendations?.length) {
      html += '<h3 style="font-size:16px;font-weight:600;margin:24px 0 14px">推奨アクション</h3>';

    }

    container.innerHTML = html;
  }

  async sendChat() {
    const input = document.getElementById('chat-input');
    if (!input || !input.value.trim()) return;

    const msg = input.value.trim();
    input.value = '';

    const history = store.get('conversationHistory') || [];
    history.push({ role: 'user', content: msg, timestamp: new Date().toISOString() });
    store.set('conversationHistory', history);
    this.renderChatMessages();

    // Generate response
    try {
      const apiKey = aiEngine.getApiKey(store.get('selectedModel'));
      let responseText;

      if (apiKey) {
        // Use real API
        const disease = store.get('selectedDisease');
        const systemPrompt = `あなたは${disease?.fullName || '慢性疾患'}の専門家です。患者に寄り添い、最新のエビデンスに基づいたアドバイスを提供してください。`;
        const userData = aiEngine.collectCurrentUserData();
        const response = await aiEngine.callModel(
          store.get('selectedModel'),
          `${systemPrompt}\n\nユーザーの健康データ: ${JSON.stringify(userData.current)}\n\nユーザーの質問: ${msg}`,
          { maxTokens: 2048 }
        );
        responseText = typeof response === 'string' ? response : (response.summary || JSON.stringify(response));
      } else {
        // Local keyword-based response (no API key needed)
        const advice = this.generateInstantAdvice(msg, 'chat');
        responseText = advice.text;
        if (advice.alerts.length > 0) {
          responseText = advice.alerts.map(a => '⚠️ ' + a.message).join('\n') + '\n\n' + responseText;
        }
        if (advice.actions.length > 0) {
          responseText += '\n\n📋 推奨アクション:\n' + advice.actions.map(a => '→ ' + a).join('\n');
        }
      }

      history.push({ role: 'assistant', content: responseText, timestamp: new Date().toISOString() });
      store.set('conversationHistory', history);
      this.renderChatMessages();
    } catch (err) {
      history.push({ role: 'assistant', content: 'すみません、応答の生成中にエラーが発生しました。もう一度お試しください。\n\nエラー: ' + err.message, timestamp: new Date().toISOString() });
      store.set('conversationHistory', history);
      this.renderChatMessages();
    }
  }

    container.innerHTML = history.map(m => Components.chatMessage(m)).join('');
    container.scrollTop = container.scrollHeight;
  }

  connectFitbit() {
    const clientId = document.getElementById('fitbit-client-id')?.value?.trim();
    if (!clientId) { Components.showToast('Client IDを入力してください', 'error'); return; }
    localStorage.setItem('fitbit_client_id', clientId);
    Integrations.fitbit.connect();
  }

  async importFitbitToday() {
    const status = document.getElementById('fitbit-import-status');
    if (status) status.innerHTML = Components.loading('Fitbitからデータを取得中...');
    try {
      await Integrations.fitbit.importToday();
      if (status) status.innerHTML = '<div style="color:var(--success);font-size:13px;padding:10px">今日のデータを取り込みました</div>';
    } catch (err) {
      if (status) status.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:10px">エラー: ${err.message}</div>`;
    }
  }

  async importFitbitHistory() {
    const status = document.getElementById('fitbit-import-status');
    if (status) status.innerHTML = Components.loading('Fitbitから過去7日分を取得中...');
    try {
      await Integrations.fitbit.importHistory(7);
      if (status) status.innerHTML = '<div style="color:var(--success);font-size:13px;padding:10px">過去7日分のデータを取り込みました</div>';
    } catch (err) {
      if (status) status.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:10px">エラー: ${err.message}</div>`;
    }
  }

  async importAppleHealthFile(file) {
    if (!file) return;
    const status = document.getElementById('apple-import-status');
    if (status) status.innerHTML = Components.loading('Apple Healthデータを解析中...');
    try {
      const count = await Integrations.importFile(file);
      if (status) status.innerHTML = `<div style="color:var(--success);font-size:13px;padding:10px">${count}件のデータを取り込みました</div>`;
    } catch (err) {
      if (status) status.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:10px">エラー: ${err.message}</div>`;
    }
  }

  // Generate quick AI insight for timeline entries
  generateQuickInsight(text) {
    if (!text || text.length < 10) return '';
    const lower = text.toLowerCase();

    // Pattern-based quick insights
    if (/pem|労作後|倦怠感がひどい|動けな/.test(lower)) return 'PEMの兆候。24-48時間の安静を推奨。活動量の見直しが必要です。';
    if (/疼痛|痛[いみ]|頭痛/.test(lower)) return '疼痛記録。痛みの時間帯・トリガーのパターンを追跡中。';
    if (/頭痛|偏頭痛|片頭痛/.test(lower)) return '頭痛パターンを追跡中。頻度・トリガー（気圧/食事/ストレス/生理周期）の記録が予防に繋がります。';
    if (/生理|月経|pms|ホルモン/.test(lower)) return '月経・ホルモン周期を追跡中。体調との相関分析で症状予防が可能になります。';
    if (/更年期|ホットフラッシュ/.test(lower)) return '更年期症状の記録。エクオール・漢方・HRT等の選択肢を主治医と相談してください。';
    if (/お腹|下痢|便秘|吐き気|胃/.test(lower)) return '消化器症状を追跡中。食事内容との相関が見えてくると改善策が明確に。';
    if (/めまい|ふらつき|立ちくらみ/.test(lower)) return 'めまいの記録。水分・塩分摂取量と起立時の状況を合わせて記録すると診断の助けに。';
    if (/肌荒れ|かゆ|湿疹|アトピー/.test(lower)) return '皮膚症状を記録中。食事・ストレス・環境との相関を分析しています。';
    if (/息苦し|呼吸|胸が/.test(lower)) return '呼吸器症状の記録。腹式呼吸の練習と姿勢改善が基本的な対策です。';
    if (/だるい|倦怠|疲れ/.test(lower)) return '疲労の記録。鉄・ビタミンB12・甲状腺機能の検査を検討してください。';
    if (/鬱|孤独|辛|死|ネガティ|絶望/.test(lower)) return '精神面のケアが重要です。信頼できる方への連絡を検討してください。';
    if (/眠[れり]|不眠|寝[れた]/.test(lower)) return '睡眠パターンを追跡中。睡眠衛生の見直しで改善の可能性があります。';
    if (/先生|診察|クリニック|病院/.test(lower)) return '医療記録。次回診察に向けてこの記録を共有することを推奨。';
    if (/ツートラム|リンデロン|エチゾラム|ステロイド|プレドニゾ/.test(lower)) return '服薬メモ。効果と副作用を追跡しています。';
    if (/コエンザイム|nmn|ビタミン|マグネシウム|サプリ/.test(lower)) return 'サプリメント記録。効果評価のため2-4週間の継続観察を。';
    if (/良[いか]|楽|元気|調子が良|できた|回復/.test(lower)) return '改善傾向。何が効果的だったか分析し、再現性を高めましょう。';
    if (/エプソムソルト|風呂|入浴/.test(lower)) return '入浴療法の記録。マグネシウム吸収と自律神経調整の効果を追跡。';
    if (/瞑想|呼吸法|ヨガ/.test(lower)) return '迷走神経トーニング効果を記録中。継続が自律神経改善の鍵です。';
    if (/気圧|天候|天気/.test(lower)) return '気象感受性を記録。気圧変動と症状の相関を分析しています。';
    if (/ジム|運動|散歩|ストレッチ/.test(lower)) return '活動記録。翌日のPEM有無を確認し、安全な活動量を学習中。';
    if (/食[べ事]|ご飯|料理/.test(lower)) return '食事記録。栄養バランスと体調の相関を分析中。';

    // Generic insight based on text length
    if (text.length > 200) return '詳細な記録です。AI分析でより深い洞察を得られます。';
    if (text.length > 50) return '記録を継続中。パターン分析の精度が向上しています。';
    return '';
  }

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).substr(2),
      timestamp: new Date().toISOString(),
      category: 'symptoms',
      type: 'text_entry',
      title: '',
      content: content
    };

    const textEntries = store.get('textEntries') || [];
    textEntries.push(entry);
    store.set('textEntries', textEntries);

    const history = store.get('conversationHistory') || [];
    history.push({ role: 'user', content: content, timestamp: entry.timestamp, type: 'data_entry' });
    store.set('conversationHistory', history);

    input.value = '';

    // Generate deep structured analysis and save to store
    const analysis = this.generateDeepAnalysis(content);
    store.set('latestFeedback', analysis);

    // Re-render dashboard with feedback
    this.navigate('dashboard');

    // Run API analysis in background if available
    const apiKey = aiEngine.getApiKey(store.get('selectedModel'));
    if (apiKey) {
      this.runBackgroundAnalysis(content, document.getElementById('dash-ai-feedback'));
    }
  }

  // Deep structured analysis of any user input
  generateDeepAnalysis(text) {
    const lower = text.toLowerCase();
    const sections = [];

    // 1. Content Classification
    const detected = [];
    if (/痛|疼痛|頭痛|腰痛|関節/.test(lower)) detected.push('疼痛');
    if (/疲|だるい|倦怠|しんどい|動けな/.test(lower)) detected.push('疲労');
    if (/眠|不眠|寝|睡眠|起き/.test(lower)) detected.push('睡眠');
    if (/鬱|不安|孤独|辛|メンタル|焦燥|イライラ|死|絶望/.test(lower)) detected.push('精神');
    if (/薬|ツートラム|リンデロン|エチゾラム|ステロイド|プレドニゾ|カロナール|処方|服薬|飲[んむ]/.test(lower)) detected.push('服薬');
    if (/食[べ事]|ご飯|栄養|サプリ|ビタミン|マグネシウム|コエンザイム|NMN/.test(lower)) detected.push('栄養');
    if (/検査|血液|CRP|数値|結果|フェリチン|甲状腺|TSH/.test(lower)) detected.push('検査');
    if (/先生|医師|診察|クリニック|病院|山村|川村/.test(lower)) detected.push('診察');
    if (/運動|ジム|散歩|ヨガ|ストレッチ|歩/.test(lower)) detected.push('運動');
    if (/気圧|天候|天気|気象/.test(lower)) detected.push('気象');
    if (/生理|月経|PMS|ホルモン|更年期/.test(lower)) detected.push('ホルモン');
    if (/風呂|入浴|エプソムソルト|温泉/.test(lower)) detected.push('入浴');
    if (/瞑想|呼吸|マインドフル|坐禅/.test(lower)) detected.push('瞑想');
    if (/PEM|労作後/.test(lower)) detected.push('PEM');
    if (/お腹|下痢|便秘|吐き気|胃|腸/.test(lower)) detected.push('消化器');
    if (/会話|文字起こし|plaud|transcript|先生.*言|診察.*記録|ミーティング|電話/.test(lower)) detected.push('会話データ');
    if (/めまい|ふらつき|立ちくらみ/.test(lower)) detected.push('めまい');
    // Extended detection
    if (/体重|kg|キロ|太|痩|ダイエット|体脂肪|BMI/.test(lower)) detected.push('体重');
    if (/心拍|HR|HRV|脈|bpm|血圧|mmHg/.test(lower)) detected.push('バイタル');
    if (/体温|熱|°C|度|発熱/.test(lower)) detected.push('体温');
    if (/SpO2|酸素|息苦し|呼吸/.test(lower)) detected.push('呼吸');
    if (/肌|皮膚|かゆ|湿疹|蕁麻疹|アトピー|ニキビ/.test(lower)) detected.push('皮膚');
    if (/尿|頻尿|排尿|腎臓|クレアチニン/.test(lower)) detected.push('泌尿器');
    if (/目|視力|ドライアイ|眼/.test(lower)) detected.push('眼');
    if (/耳|聴力|耳鳴り|難聴/.test(lower)) detected.push('耳');
    if (/歯|口|口内炎|歯茎/.test(lower)) detected.push('口腔');
    if (/髪|脱毛|薄毛|抜け毛/.test(lower)) detected.push('毛髪');
    if (/酒|アルコール|飲酒|ビール|ワイン/.test(lower)) detected.push('飲酒');
    if (/コーヒー|カフェイン|お茶|紅茶/.test(lower)) detected.push('カフェイン');
    if (/水|水分|脱水|飲む量/.test(lower)) detected.push('水分');
    if (/旅行|出張|飛行機|移動|時差/.test(lower)) detected.push('移動');
    if (/仕事|プロジェクト|締切|ミーティング|作業/.test(lower)) detected.push('仕事');
    if (/お金|費用|医療費|保険|経済|金銭/.test(lower)) detected.push('経済');
    if (/家族|妻|夫|子供|親|母|父|兄弟|姉妹/.test(lower)) detected.push('家族');
    if (/友人|友達|恋人|彼女|彼氏|パートナー/.test(lower)) detected.push('人間関係');
    if (/遺伝子|SNP|HLA|ゲノム|DNA/.test(lower)) detected.push('遺伝子');
    if (/MRI|CT|X線|レントゲン|超音波|エコー/.test(lower)) detected.push('画像診断');
    if (/鍼|灸|マッサージ|整体|カイロ/.test(lower)) detected.push('代替療法');
    if (/漢方|ツムラ|クラシエ|五苓散|補中益気/.test(lower)) detected.push('漢方');
    if (/ラーメン|寿司|焼肉|パスタ|カレー|弁当|コンビニ|外食/.test(lower)) detected.push('外食');
    if (detected.length === 0) detected.push('日常記録');

    // 2. Status Assessment
    const isPositive = /良[いか]|楽|嬉し|元気|回復|改善|できた|調子/.test(lower);
    const isNegative = /悪[いか]|辛|つら|ひどい|最悪|動けな|痛[いみ]|だるい/.test(lower);
    const urgency = /死|自殺|救急|呼吸困難|意識/.test(lower) ? 'urgent' : isNegative ? 'attention' : 'normal';

    // 3. Build structured sections
    // Section: 記録の要約
    sections.push({
      title: '記録の分析',
      icon: '📋',
      content: `検出カテゴリ：${detected.join('・')}\n状態評価：${urgency === 'urgent' ? '緊急性あり' : isPositive ? '改善傾向' : isNegative ? '注意が必要' : '経過観察'}`
    });

    // Section: 具体的な所見
    let findings = '';
    if (detected.includes('服薬')) {
      const meds = [];
      if (/ツートラム/.test(lower)) meds.push('トラマドール（疼痛管理）');
      if (/リンデロン|ベタメタゾン/.test(lower)) meds.push('ベタメタゾン（抗炎症・ステロイド）');
      if (/エチゾラム|デパス/.test(lower)) meds.push('エチゾラム（抗不安・筋弛緩）');
      if (/プレドニゾ/.test(lower)) meds.push('プレドニゾン/プレドニゾロン（免疫抑制）');
      if (/カロナール/.test(lower)) meds.push('アセトアミノフェン（解熱鎮痛）');
      if (/リボトリール/.test(lower)) meds.push('クロナゼパム（抗てんかん・抗不安）');
      if (/レクサプロ/.test(lower)) meds.push('エスシタロプラム（SSRI）');
      if (/五苓散/.test(lower)) meds.push('五苓散（漢方・水分代謝）');
      if (/リベルサス|セマグルチド/.test(lower)) meds.push('セマグルチド（GLP-1受容体作動薬）');
      if (meds.length > 0) findings += `【検出された薬剤】\n${meds.map(m => '・' + m).join('\n')}\n\n`;
      findings += '注意：複数の薬剤を使用中の場合、相互作用に注意が必要です。次回診察時にお薬手帳を必ず持参してください。\n\n';
    }
    if (detected.includes('検査')) {
      findings += '【検査データ】\n記録された検査情報を追跡しています。基準値との比較や推移の分析には、具体的な数値（例：CRP 0.5, TSH 2.3 等）を入力するとより精密な分析が可能です。\n\n';
    }
    if (detected.includes('疼痛')) {
      findings += '【疼痛分析】\n痛みのパターンを追跡中です。より精密な分析のために、以下も記録してください：\n・部位（頭/首/肩/腰/全身）\n・強度（1-10）\n・種類（鈍痛/鋭痛/灼熱感/しびれ）\n・時間帯（朝/午後/夜間）\n・トリガー（活動後/天気/ストレス/食事後）\n\n';
    }
    if (detected.includes('ホルモン')) {
      findings += '【ホルモン・月経分析】\n周期と体調の相関を追跡しています。月経周期日数、基礎体温、症状の強さを継続記録すると、予測と予防が可能になります。\n\n';
    }
    if (detected.includes('会話データ')) {
      // Analyze conversation patterns
      const negWords = (lower.match(/辛|つら|痛|だるい|しんどい|死|無理|不安|孤独|鬱|厳し|最悪|ダメ|嫌/g) || []).length;
      const posWords = (lower.match(/良[いか]|楽し|嬉し|ありがた|元気|回復|できた|感謝|幸せ|大丈夫/g) || []).length;
      const stressLevel = Math.min(10, Math.max(1, Math.round(negWords * 2 - posWords + 5)));
      const energyLevel = posWords > negWords ? '比較的良好' : negWords > 3 ? '低下傾向' : '普通';

      findings += '【会話データ分析】\n';
      findings += `ストレス推定スコア: ${stressLevel}/10\n`;
      findings += `エネルギーレベル: ${energyLevel}\n`;
      findings += `ネガティブ語検出: ${negWords}件 / ポジティブ語検出: ${posWords}件\n\n`;

      if (negWords > posWords * 2) {
        findings += '⚠️ ネガティブな表現が多く、精神的な負荷が高い状態と推定されます。\n';
        findings += '信頼できる方との対話や、専門家への相談を検討してください。\n\n';
      }
      if (/先生|医師|クリニック|病院|診察/.test(lower)) {
        findings += '【医療者との会話を検出】\n';
        findings += '診察内容や処方の変更点を整理しています。\n';
        findings += 'テキストで補足（「○○先生から△△の処方が追加された」等）を入力すると、より正確な追跡ができます。\n\n';
      }
    }

    // Extended findings
    if (detected.includes('体重')) findings += '【体重管理】体重の変動を追跡中。急激な増減（1週間で2kg以上）は医師に報告を。BMIだけでなく体組成（筋肉量/体脂肪率）も重要です。\n\n';
    if (detected.includes('バイタル')) findings += '【バイタルサイン】心拍数・血圧データを記録中。安静時心拍+30bpmを超える活動は要注意（PEM予防）。起立時に20bpm以上の増加があればPOTSの可能性。\n\n';
    if (detected.includes('体温')) findings += '【体温】体温変動を追跡。37.5°C以上が続く場合は感染症や炎症の兆候。基礎体温の記録はホルモンバランスの評価に有用です。\n\n';
    if (detected.includes('皮膚')) findings += '【皮膚症状】腸内環境・食物アレルギー・ストレスとの関連を分析中。IgG食物アレルギー検査で隠れたトリガーが見つかる場合があります。\n\n';
    if (detected.includes('飲酒')) findings += '【飲酒記録】アルコールは免疫機能低下、睡眠の質悪化、薬との相互作用のリスクあり。慢性疾患患者は特に少量でも影響が大きいため注意。\n\n';
    if (detected.includes('カフェイン')) findings += '【カフェイン】カフェインは自律神経に影響。POTSやME/CFSでは過敏になることも。午後2時以降は控えると睡眠改善に。\n\n';
    if (detected.includes('水分')) findings += '【水分摂取】1日1.5-2Lが目安。POTS患者は2-3L+塩分補給が推奨。脱水は倦怠感・頭痛・めまいを悪化させます。\n\n';
    if (detected.includes('仕事')) findings += '【仕事・活動量】業務負荷とPEM/ストレスの相関を分析中。50分作業→10分休憩のポモドーロ法で過負荷を防止。重要な会議前後は休息時間を確保。\n\n';
    if (detected.includes('経済')) findings += '【経済・医療費】高額療養費制度、難病医療費助成、障害年金、自立支援医療制度が利用可能な場合があります。お住まいの自治体の窓口に相談を。\n\n';
    if (detected.includes('家族') || detected.includes('人間関係')) findings += '【人間関係】社会的つながりは回復の重要な要素。慢性疾患の理解者を持つことがストレス軽減に。患者会やオンラインコミュニティの活用も検討を。\n\n';
    if (detected.includes('遺伝子')) findings += '【遺伝子データ】薬剤代謝（CYP2D6等）、メチレーション（MTHFR）、疾患リスクの個別化分析が可能。具体的なSNPデータを入力すると精密な提案ができます。\n\n';
    if (detected.includes('画像診断')) findings += '【画像診断】所見テキストを入力すると、専門用語の解説と経過観察のポイントを整理します。前回の結果との比較も可能です。\n\n';
    if (detected.includes('代替療法') || detected.includes('漢方')) findings += '【代替療法/漢方】エビデンスのある代替療法を評価中。漢方は証（しょう）に基づく処方が重要。西洋薬との併用注意も確認します。\n\n';
    if (detected.includes('外食')) findings += '【外食記録】外食は塩分・脂質・糖質が高くなりがち。抗炎症の観点から、野菜追加・スープ残し・食後の運動を推奨。食後の体調変化も記録してください。\n\n';
    if (detected.includes('移動')) findings += '【移動・旅行】環境変化はストレス要因。長距離移動後はPEM予防で1-2日の回復期間を。時差がある場合はメラトニンで概日リズム調整を。\n\n';

    if (findings) sections.push({ title: '詳細所見', icon: '🔍', content: findings });

    // Section: 即時アクション
    const actions = [];
    if (urgency === 'urgent') {
      actions.push('今すぐ信頼できる人に連絡してください');
      actions.push('必要であれば救急（119）に電話を');
    }
    if (detected.includes('PEM')) {
      actions.push('活動を即座に中断し、暗く静かな環境で安静に');
      actions.push('次の24-48時間は回復に充てる');
    }
    if (detected.includes('疼痛')) {
      actions.push('痛み止めは早めに服用（食事と一緒に）');
      actions.push('エプソムソルト入浴（38°C, 20分）を試す');
    }
    if (detected.includes('睡眠')) {
      actions.push('就寝2時間前からスクリーンを避ける');
      actions.push('寝室の温度を21-23°Cに調整');
    }
    if (detected.includes('精神')) {
      actions.push('4-7-8呼吸法を3セット行う');
      actions.push('信頼できる人と話す');
    }
    if (detected.includes('会話データ')) {
      actions.push('会話で気になった点をテキストでメモする');
      actions.push('ストレスが高い場合は4-7-8呼吸法を実施');
      if (/先生|医師|診察/.test(lower)) {
        actions.push('診察内容をテキストで整理して記録する');
        actions.push('次回の診察で確認したいことをメモする');
      }
    }
    if (detected.includes('気象')) {
      actions.push('気圧予報を確認し、五苓散の予防服用を検討');
    }
    if (detected.includes('消化器')) {
      actions.push('消化に優しい食事（おかゆ、味噌汁等）を摂る');
      actions.push('水分をこまめに補給する');
    }
    if (isPositive) {
      actions.push('良かった要因を振り返ってメモする（再現性の鍵）');
    }
    if (actions.length === 0) {
      actions.push('この記録を継続してください（パターン分析に活用されます）');
    }
    sections.push({ title: '今すぐできること', icon: '⚡', content: actions.map(a => '→ ' + a).join('\n') });

    // Section: より深い分析のために
    const deeperPrompts = [];
    if (!detected.includes('服薬')) deeperPrompts.push('現在服用中の薬とサプリメントを記録すると、飲み合わせ分析ができます');
    if (!detected.includes('検査')) deeperPrompts.push('血液検査の数値を入力すると、栄養状態と炎症レベルを評価できます');
    if (!detected.includes('睡眠')) deeperPrompts.push('睡眠時間と質を記録すると、体調との相関が見えてきます');
    if (!detected.includes('栄養')) deeperPrompts.push('食事内容を記録すると、栄養バランスの最適化提案ができます');
    if (deeperPrompts.length > 0) {
      sections.push({ title: 'さらに精度を上げるには', icon: '💡', content: deeperPrompts.map(p => '・' + p).join('\n') });
    }

    return {
      timestamp: new Date().toISOString(),
      detected,
      urgency,
      isPositive,
      sections
    };
  }

  async runBackgroundAnalysis(userInput, feedbackEl) {
    try {
      const diseases = store.get('selectedDiseases') || [];
      const profile = store.get('userProfile') || {};
      const recentEntries = (store.get('textEntries') || []).slice(-5).map(e => e.content).join('\n---\n');

      const prompt = `以下のユーザーの最新の記録に基づいて、具体的で実行可能なアドバイスを日本語で提供してください。

【ユーザー情報】
疾患: ${diseases.join(', ') || '未設定'}
居住地: ${profile.location || '日本'}
年齢: ${profile.age || '未設定'}

【最新の記録】
${userInput}

【直近の記録履歴】
${recentEntries.substring(0, 3000)}

以下を必ず含めてください：
1. この記録から読み取れる健康状態の評価
2. 具体的な改善アクション（今日できること）
3. 注意すべき兆候（レッドフラッグ）があれば
4. 推奨するサプリメントや食事の変更
5. 必要であれば受診の推奨`;

      const response = await aiEngine.callModel(store.get('selectedModel'), prompt, { maxTokens: 2048 });

      if (typeof response === 'string' && response.length > 50) {
        // API returned real response - update feedback
        if (feedbackEl) {
          feedbackEl.innerHTML = `
            <div class="card" style="border-color:var(--success);border-left:4px solid var(--success)">
              <div class="card-header" style="padding:10px 16px">
                <span style="font-size:13px;font-weight:600">詳細分析</span>
                <span class="tag tag-success" style="font-size:9px">API応答</span>
              </div>
              <div class="card-body" style="padding:14px 16px">
                <div style="font-size:13px;color:var(--text-primary);line-height:1.8;white-space:pre-wrap">${Components.formatMarkdown(response)}</div>
              </div>
            </div>`;
        }
      }
    } catch (err) {
      console.log('[Background Analysis] Failed:', err.message);
      // Keep local analysis visible - don't replace
    }
  }

  dashQuickFile(event) {
    const files = event.target.files;
    if (!files.length) return;

    Components.showToast(`${files.length}件のファイルを処理中...`, 'info');

    Array.from(files).forEach(async (file) => {
      // Determine file category from type and name
      const isImage = file.type.startsWith('image/');
      const isPDF = file.type === 'application/pdf';
      const fileName = file.name.toLowerCase();

      // Auto-categorize
      let category = 'その他';
      let analysisPrompt = '';
      if (isImage) {
        // Images are likely: food photos, test results, prescriptions, skin conditions
        category = '写真';
        analysisPrompt = `[写真アップロード] ${file.name}
これは画像ファイルです。以下の可能性があります：

【食事写真の場合】
・写真に写っている料理の推定カロリー、栄養バランス（タンパク質/脂質/炭水化物）を分析
・慢性疾患との関連（抗炎症食か、血糖値への影響、腸内環境への影響）
・改善提案（不足している栄養素、追加すべき食材）
・この食事の良い点と注意点

【検査結果写真の場合】
・数値を読み取り、基準値との比較
・異常値があれば具体的なアクション提案

【処方箋/お薬手帳の場合】

  // ---- Data Page File Upload ----
  dataPageFileUpload(files) {
    if (!files || !files.length) return;
    const resultEl = document.getElementById('data-file-result');
    if (resultEl) resultEl.innerHTML = Components.loading('ファイルを処理中...');

    Array.from(files).forEach(async (file) => {
      const textForAnalysis = [];

      if (!file.type.startsWith('image/')) {
        try {
          const count = await Integrations.importFile(file);
          if (count > 0) textForAnalysis.push(`[ファイル取込] ${file.name}: ${count}件のデータ`);
        } catch(e) { /* fall through */ }
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        store.addHealthData('photos', {
          filename: file.name, type: file.type, size: file.size,
          dataUrl: file.type.startsWith('image/') ? ev.target.result.substring(0, 500) : '',
          category: 'general'
        });

        textForAnalysis.push(`[ファイル] ${file.name} (${file.type}, ${(file.size/1024).toFixed(0)}KB)`);

        const history = store.get('conversationHistory') || [];
        history.push({ role: 'user', content: textForAnalysis.join('\n'), timestamp: new Date().toISOString(), type: 'file_upload' });
        store.set('conversationHistory', history);

        const isImage = file.type.startsWith('image/');
        const category = isImage ? '写真' : '検査結果';
        const analysis = this.generateFileAnalysis(file.name, file.type, category);
        store.set('latestFeedback', analysis);

        Components.showToast(`${file.name} を保存しました`, 'success');

        if (resultEl) {
          resultEl.innerHTML = `<div class="card" style="border-left:4px solid var(--accent)">
            ${analysis.sections.map(s => `<div style="padding:10px 14px;border-bottom:1px solid var(--border)"><div style="font-size:12px;font-weight:600;margin-bottom:4px">${s.icon} ${s.title}</div><div style="font-size:12px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap">${s.content}</div></div>`).join('')}
          </div>`;
        }
      };
      reader.readAsDataURL(file);
    });
  }

  saveDiseaseSettings() {
    const checkboxes = document.querySelectorAll('.settings-disease-cb');
    const selected = [];
    checkboxes.forEach(cb => { if (cb.checked) selected.push(cb.value); });
    store.set('selectedDiseases', selected);

    // Set primary disease
    if (selected.length > 0) {
      for (const cat of CONFIG.DISEASE_CATEGORIES) {
        const found = cat.diseases.find(d => d.id === selected[0]);
        if (found) {
          store.set('selectedDisease', { id: found.id, name: found.name, fullName: found.name, icon: cat.icon, color: '#6C63FF' });
          break;
        }
      }
    }

    if (FirebaseBackend.initialized) {
      FirebaseBackend.saveProfile({ settings: { selectedDiseases: selected, selectedDisease: store.get('selectedDisease') } });
    }

    const countEl = document.getElementById('settings-disease-count');
    if (countEl) countEl.textContent = selected.length + '件選択';
    Components.showToast(`${selected.length}件の疾患を保存しました`, 'success');
  }

  initNutritionCharts() {
    const nlog = store.get('nutritionLog') || [];

    const bmr = store.calculateBMR();
    const labels = nlog.map(e => {
      const d = new Date(e.date);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    });

    // カロリーチャート

          fill: true,
          pointRadius: 4,

        datasets.push({
          label: '基礎代謝 (BMR)',
          data: nlog.map(() => bmr),
          borderColor: '#ef4444',
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          borderWidth: 2,
        });
      }
      this.chartInstances.nutritionCal = new Chart(calCtx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#8896b0', font: { size: 11 } } } },
          scales: {
            y: { beginAtZero: false, ticks: { color: '#8896b0', callback: (v) => v.toLocaleString() } },
            x: { grid: { display: false }, ticks: { color: '#8896b0' } }
          }
        }
      });
    }

    // PFCチャート (stacked bar)
    const pfcCtx = document.getElementById('nutrition-pfc-chart');
    if (pfcCtx) {
      if (this.chartInstances.nutritionPfc) this.chartInstances.nutritionPfc.destroy();
      this.chartInstances.nutritionPfc = new Chart(pfcCtx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'タンパク質 (P)', data: nlog.map(e => e.protein_g), backgroundColor: '#3b82f6' },
            { label: '脂質 (F)', data: nlog.map(e => e.fat_g), backgroundColor: '#f59e0b' },
            { label: '炭水化物 (C)', data: nlog.map(e => e.carbs_g), backgroundColor: '#10b981' },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#8896b0', font: { size: 11 } } } },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { color: '#8896b0' } },
            y: { stacked: true, beginAtZero: true, ticks: { color: '#8896b0', callback: (v) => v + ' g' } }
          }
        }
      });
    }
  }

  // 今日の日記テキストから AI で栄養を推定して nutritionLog に保存
  async extractTodayNutrition() {
    const today = new Date().toISOString().split('T')[0];
    const textEntries = store.get('textEntries') || [];
    const todayEntries = textEntries.filter(e => {
      const d = e.timestamp ? new Date(e.timestamp).toISOString().split('T')[0] : null;
      return d === today;
    });
    if (todayEntries.length === 0) {
      Components.showToast('今日の記録がありません。先に食事内容を入力してください。', 'error');
      return;
    }

    const apiKey = aiEngine.getApiKey(store.get('selectedModel'));
    if (!apiKey) {
      Components.showToast('APIキーが設定されていません（設定画面で登録してください）', 'error');
      return;
    }

    Components.showToast('AIが栄養を推定中...', 'info');
    const combined = todayEntries.map(e => e.content).join('\n---\n');
    const prompt = `以下は今日の日記です。食事に関する記述から1日分の合計栄養を推定し、必ず以下のJSON形式だけで回答してください。食事の記載がない場合は calories:0 としてください。

【日記】
${combined}

【出力フォーマット】
{
  "calories": 0,
  "protein_g": 0,
  "fat_g": 0,
  "carbs_g": 0,
  "confidence": "low|medium|high",
  "note": "推定の前提を簡潔に"
}`;

    try {
      const response = await aiEngine.callModel(store.get('selectedModel'), prompt, { maxTokens: 1024 });
      const text = typeof response === 'string' ? response : JSON.stringify(response);
      // Extract JSON from response
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('AIレスポンスからJSONを抽出できませんでした');
      const data = JSON.parse(match[0]);
      store.upsertNutritionEntry({
        date: today,
        calories: data.calories || 0,
        protein_g: data.protein_g || 0,
        fat_g: data.fat_g || 0,
        carbs_g: data.carbs_g || 0,
        confidence: data.confidence || 'unknown',
        note: data.note || '',
      });
      Components.showToast(`栄養を記録しました（${data.calories || 0} kcal）`, 'success');
      // Re-render dashboard
      if (this.currentPage === 'dashboard') this.navigate('dashboard');
    } catch (err) {
      console.error('Nutrition extraction failed:', err);
      Components.showToast('栄養の推定に失敗しました: ' + err.message, 'error');
    }
  }

  clearNutritionLog() {
    if (!confirm('栄養ログをすべて削除します。よろしいですか？')) return;
    store.set('nutritionLog', []);
    Components.showToast('栄養ログを削除しました', 'success');
    if (this.currentPage === 'dashboard') this.navigate('dashboard');
  }
};

  const lastUpdate = lastEntry ? new Date(lastEntry.timestamp).toLocaleString('ja-JP') : (symptoms.length ? new Date(latest.timestamp).toLocaleString('ja-JP') : '未記録');

  // Calculate real stats from symptom data
  const recent7 = symptoms.filter(s => (Date.now() - new Date(s.timestamp)) < 7 * 86400000);
  const avgField = (arr, f) => { const v = arr.map(s => s[f]).filter(x => x != null); return v.length ? (v.reduce((a,b) => a+b, 0) / v.length).toFixed(1) : '--'; };
  const changeField = (arr, f) => {
    if (arr.length < 2) return 0;
    const half = Math.floor(arr.length / 2);
    const first = arr.slice(0, half).map(s => s[f]).filter(x => x != null);
    const second = arr.slice(half).map(s => s[f]).filter(x => x != null);
    if (!first.length || !second.length) return 0;
    const avg1 = first.reduce((a,b) => a+b, 0) / first.length;
    const avg2 = second.reduce((a,b) => a+b, 0) / second.length;
    return avg1 === 0 ? 0 : Math.round(((avg2 - avg1) / avg1) * 100);
  };

  const fatigueAvg = avgField(recent7, 'fatigue_level');
  const painAvg = avgField(recent7, 'pain_level');
  const fogAvg = avgField(recent7, 'brain_fog');
  const sleepAvg = avgField(recent7, 'sleep_quality');
  const fatigueChange = changeField(recent7, 'fatigue_level');
  const painChange = changeField(recent7, 'pain_level');
  const fogChange = changeField(recent7, 'brain_fog');
  const sleepChange = changeField(recent7, 'sleep_quality');

  // Latest text entries for dashboard
  const recentTexts = textEntries.slice(-3).reverse();

  // Show all selected diseases

  selectedDiseases.forEach(id => {

    for (const cat of CONFIG.DISEASE_CATEGORIES) {

    }

    : `<span class="tag tag-accent" style="font-size:10px">${disease.name}</span>`;

// AI Analysis Page
App.prototype.render_analysis = function() {
  const prompts = store.get('customPrompts') || DEFAULT_PROMPTS;
  const model = store.get('selectedModel') || 'claude-opus-4-6';

  const modelOpts = CONFIG.AI_MODELS.map(m =>
    `<option value="${m.id}" ${m.id === model ? 'selected' : ''}>${m.name} (${m.provider})</option>`
  ).join('');

  const promptBtns = Object.entries(prompts).map(([key, p]) => `

      <h2 style="font-size:18px;font-weight:700;margin-bottom:6px">AI分析</h2>

    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <select class="form-select" style="width:auto" onchange="app.setModel(this.value)">
        ${modelOpts}
      </select>

  </div>

  <!-- Prompt Selection -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-header"><span class="card-title">分析プロンプト</span></div>

};

// Timeline Page
App.prototype.render_timeline = function() {
  // Collect ALL data sources
  const allEntries = [];

  // Text entries (diary, notes)
  (store.get('textEntries') || []).forEach(d => allEntries.push({
    ...d, _type: 'text', _icon: '📝', _label: d.title || '日記',
    _category: d.category || 'other'
  }));

  // Symptoms
  (store.get('symptoms') || []).forEach(d => {
    if (d.text_note) {
      allEntries.push({ ...d, _type: 'symptom_note', _icon: '📝', _label: d.title || '症状メモ' });
    } else {
      allEntries.push({ ...d, _type: 'symptom_data', _icon: '📊', _label: '症状スコア' });
    }
  });

  // Vitals
  (store.get('vitals') || []).forEach(d => allEntries.push({
    ...d, _type: 'vitals', _icon: '💓', _label: 'バイタル'
  }));

  // Blood tests
  (store.get('bloodTests') || []).forEach(d => allEntries.push({
    ...d, _type: 'blood', _icon: '🩸', _label: '血液検査'
  }));

  // Medications
  (store.get('medications') || []).forEach(d => allEntries.push({
    ...d, _type: 'medication', _icon: '💊', _label: '服薬記録'
  }));

  // Sleep
  (store.get('sleepData') || []).forEach(d => allEntries.push({
    ...d, _type: 'sleep', _icon: '😴', _label: '睡眠'
  }));

  // Activity
  (store.get('activityData') || []).forEach(d => allEntries.push({
    ...d, _type: 'activity', _icon: '🚶', _label: '活動量'
  }));

  // Photos
  (store.get('photos') || []).forEach(d => allEntries.push({
    ...d, _type: 'photo', _icon: '📸', _label: d.filename || '写真'
  }));

  // Conversation history (AI chat)
  (store.get('conversationHistory') || []).filter(c => c.type === 'data_entry').forEach(d => {
    // Already in textEntries, skip duplicates
  });

  // Sort by timestamp (newest first)
  allEntries.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

  // Group by date
  const byDate = {};
  allEntries.forEach(e => {
    const dateKey = e.timestamp ? new Date(e.timestamp).toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' }) : '日付不明';
    if (!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push(e);
  });

  // Category labels for filter
  const categoryLabels = {
    text: '日記・メモ', symptom_note: '症状メモ', symptom_data: '症状スコア',
    vitals: 'バイタル', blood: '血液検査', medication: '服薬',
    sleep: '睡眠', activity: '活動', photo: '写真'
  };

  // Render entries
  const renderEntry = (e) => {
    const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' }) : '';
    const skipKeys = ['id', 'timestamp', 'category', '_type', '_icon', '_label', '_category', 'createdAt', '_synced', 'type', 'source', 'dataUrl'];

    // Text entries - show formatted content
    if (e._type === 'text' || e._type === 'symptom_note') {
      const content = e.content || e.text_note || '';
      const aiInsight = app.generateQuickInsight(content);
      return `
        <div class="card" style="margin-bottom:10px;border-left:3px solid var(--accent)">
          <div class="card-body" style="padding:12px 16px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <div style="display:flex;align-items:center;gap:8px">
                <span>${e._icon}</span>
                <span style="font-size:12px;font-weight:600">${e._label}</span>
                ${e._category ? `<span class="tag tag-accent" style="font-size:9px">${e._category}</span>` : ''}
              </div>
              <span style="font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace">${time}</span>
            </div>
            <div style="font-size:13px;color:var(--text-primary);line-height:1.8;white-space:pre-wrap;margin-bottom:8px">${content}</div>
            ${aiInsight ? `<div style="padding:8px 12px;background:var(--accent-bg);border-radius:var(--radius-sm);font-size:11px;color:var(--accent)"><strong>分析:</strong> ${aiInsight}</div>` : ''}
          </div>
        </div>`;
    }

    // Symptom scores
    if (e._type === 'symptom_data') {
      const fields = [];
      if (e.fatigue_level != null) fields.push(`疲労: ${e.fatigue_level}/7`);
      if (e.pain_level != null) fields.push(`痛み: ${e.pain_level}/7`);
      if (e.brain_fog != null) fields.push(`脳霧: ${e.brain_fog}/7`);
      if (e.sleep_quality != null) fields.push(`睡眠: ${e.sleep_quality}/7`);
      if (e.pem_status) fields.push('PEM: あり');
      const avgScore = fields.length > 0 ? '（平均 ' + (((e.fatigue_level||0)+(e.pain_level||0)+(e.brain_fog||0))/3).toFixed(1) + '/7）' : '';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg-tertiary);border-radius:var(--radius-sm);margin-bottom:6px">
          <span>${e._icon}</span>
          <span style="font-size:12px;flex:1">${fields.join(' | ')}</span>
          <span style="font-size:11px;color:var(--text-muted)">${avgScore} ${time}</span>
        </div>`;
    }

    // Vitals
    if (e._type === 'vitals') {
      const fields = [];
      if (e.heart_rate) fields.push(`HR: ${e.heart_rate}bpm`);
      if (e.temperature) fields.push(`体温: ${e.temperature}°C`);
      if (e.spo2) fields.push(`SpO2: ${e.spo2}%`);
      if (e.bp_systolic) fields.push(`BP: ${e.bp_systolic}/${e.bp_diastolic}`);
      if (e.hrv) fields.push(`HRV: ${e.hrv}ms`);
      if (e.weight) fields.push(`体重: ${e.weight}kg`);
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg-tertiary);border-radius:var(--radius-sm);margin-bottom:6px">
          <span>💓</span>
          <span style="font-size:12px;flex:1">${fields.join(' | ') || 'バイタルデータ'}</span>
          <span style="font-size:11px;color:var(--text-muted)">${time}</span>
        </div>`;
    }

    // Photos
    if (e._type === 'photo') {
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg-tertiary);border-radius:var(--radius-sm);margin-bottom:6px">
          <span>📸</span>
          <span style="font-size:12px;flex:1">${e.filename || '画像'} (${e.type || ''}, ${e.size ? (e.size/1024).toFixed(0)+'KB' : ''})</span>
          <span style="font-size:11px;color:var(--text-muted)">${time}</span>
        </div>`;
    }

    // Generic data entry
    const dataFields = Object.entries(e)
      .filter(([k, v]) => !skipKeys.includes(k) && v != null && v !== '' && !k.startsWith('_'))
      .map(([k, v]) => `<span style="margin-right:12px"><strong style="color:var(--text-muted)">${k}:</strong> ${v}</span>`)
      .join('');
    return `
      <div style="display:flex;align-items:start;gap:10px;padding:8px 14px;background:var(--bg-tertiary);border-radius:var(--radius-sm);margin-bottom:6px">
        <span>${e._icon}</span>
        <div style="font-size:12px;flex:1;line-height:1.6">${dataFields || e._label}</div>
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap">${time}</span>
      </div>`;
  };

  // Render by date
  const dateGroups = Object.entries(byDate).map(([dateStr, entries]) => `
    <div style="margin-bottom:24px">
      <div style="font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block">${dateStr}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;display:inline;margin-left:10px">${entries.length}件</div>
      ${entries.map(renderEntry).join('')}
    </div>
  `).join('');

  return `
  <div style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <div>
      <h2 style="font-size:18px;font-weight:700;margin-bottom:4px">経過・データ一覧</h2>
      <p style="font-size:12px;color:var(--text-muted)">${allEntries.length}件のデータ（日記・検査・薬剤・バイタル・写真）</p>
    </div>
    <div style="display:flex;gap:8px">
      <select class="form-select" style="width:auto;font-size:12px" onchange="app.filterTimeline(this.value)">
        <option value="">すべて表示</option>
        ${Object.entries(categoryLabels).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
      </select>
    </div>
  </div>
  <div id="timeline-content">
    ${allEntries.length > 0 ? dateGroups : Components.emptyState('📅', 'データがありません', 'ダッシュボードから体調を記録すると、ここに時系列で表示されます。')}
  </div>`;
};

App.prototype.render_admin = function() {
  const model = store.get('selectedModel') || 'claude-opus-4-6';
  // Merge: DEFAULT_PROMPTS as base, user customPrompts override
  const userPrompts = store.get('customPrompts') || {};
  const prompts = { ...DEFAULT_PROMPTS, ...userPrompts };

  const modelCards = CONFIG.AI_MODELS.map(m => `
    <div class="action-card ${m.id === model ? 'selected' : ''}"
      onclick="app.setModel('${m.id}')"
      style="${m.id === model ? 'border-color:var(--accent);background:var(--accent-bg)' : ''}">
      <div class="action-card-title">${m.name}</div>
      <div class="action-card-desc">${m.provider} - ${m.description}</div>
      ${m.id === model ? '<span class="tag tag-accent">使用中</span>' : ''}
    </div>
  `).join('');

  // Group prompts by disease
  const promptsByDisease = {};
  Object.entries(prompts).forEach(([key, p]) => {
    const group = p.disease || '_universal';
    if (!promptsByDisease[group]) promptsByDisease[group] = [];
    promptsByDisease[group].push({ key, ...p });

  const diseaseLabels = { '_universal': '共通（全疾患・健常者）' };
  CONFIG.DISEASE_CATEGORIES.forEach(cat => {
    cat.diseases.forEach(d => { diseaseLabels[d.id] = d.name; });
  });

  const promptEditors = Object.entries(promptsByDisease).map(([diseaseId, promptList]) => `
    <div style="margin-bottom:24px">
      <h4 style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px;padding:6px 12px;background:var(--accent-bg);border-radius:var(--radius-xs);display:inline-block">${diseaseLabels[diseaseId] || diseaseId}（${promptList.length}件）</h4>
      ${promptList.map(p => `
        <div class="card" style="margin-bottom:16px">
          <div class="card-header" style="padding:14px 20px">
            <div style="flex:1">
              <input class="form-input" data-prompt-name="${p.key}" value="${p.name}"
                style="font-weight:600;border:none;background:transparent;padding:0;font-size:14px;color:var(--text-primary);width:100%">
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${p.description || ''}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">

// Export Data utility
App.prototype.exportData = function() {
  const data = {
    exportDate: new Date().toISOString(),
    user: store.get('user'),
    disease: store.get('selectedDisease'),
    selectedDiseases: store.get('selectedDiseases'),
    symptoms: store.get('symptoms'),
    vitals: store.get('vitals'),
    bloodTests: store.get('bloodTests'),
    medications: store.get('medications'),
    supplements: store.get('supplements'),
    meals: store.get('meals'),
    sleepData: store.get('sleepData'),
    activityData: store.get('activityData'),
    analysisHistory: store.get('analysisHistory'),
    conversationHistory: store.get('conversationHistory'),
    textEntries: store.get('textEntries'),
    customPrompts: store.get('customPrompts'),
    selectedModel: store.get('selectedModel')
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chroniccare_export_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  Components.showToast('データをエクスポートしました', 'success');
};

// Import Data from JSON file
App.prototype.importDataFile = function(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      let count = 0;

      const importKeys = [
        'selectedDisease', 'selectedDiseases', 'symptoms', 'vitals',
        'bloodTests', 'medications', 'supplements', 'meals',
        'sleepData', 'activityData', 'analysisHistory',
        'conversationHistory', 'textEntries', 'customPrompts', 'selectedModel'
      ];

      importKeys.forEach(key => {
        if (data[key] !== undefined && data[key] !== null) {
          const existing = store.get(key);
          if (Array.isArray(existing) && Array.isArray(data[key])) {
            // Merge arrays (avoid duplicates by id)
            const existingIds = new Set(existing.map(e => e.id).filter(Boolean));
            const newItems = data[key].filter(item => !item.id || !existingIds.has(item.id));
            store.set(key, [...existing, ...newItems]);
            count += newItems.length;
          } else if (!existing || (Array.isArray(existing) && existing.length === 0) || (typeof existing === 'object' && Object.keys(existing).length === 0)) {
            store.set(key, data[key]);
            count++;
          }
        }
      });

      store.calculateHealthScore();
      Components.showToast('データをインポートしました（' + count + '件）', 'success');

      // Sync to Firestore if connected
      if (FirebaseBackend.initialized) {
        FirebaseBackend.loadAllData().then(() => {
          // Re-save all imported data to Firestore
          const textEntries = store.get('textEntries') || [];
          textEntries.forEach(entry => {
            if (!entry._synced) {
              FirebaseBackend.saveHealthEntry('textEntries', entry);
              entry._synced = true;
            }
          });
        });
        Components.showToast('Firestoreに同期中...', 'info');
      }
    } catch (err) {
      Components.showToast('インポートエラー: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
};



document.addEventListener('DOMContentLoaded', function() { app.init(); });
</script>
</body>
</html>
