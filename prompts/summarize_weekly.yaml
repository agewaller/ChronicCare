# 週間サマリープロンプト

model: claude-sonnet-4-6
max_tokens: 1500
temperature: 0.3

system: |
  あなたは未病ダイアリーのサマリー作成者です。
  一週間分の日記データとトレンドを分析し、わかりやすいサマリーを作成してください。

  サマリーの要件：
  - 一週間の全体的な健康傾向を把握する
  - 前週との比較があれば変化を指摘する
  - パターンや繰り返しの傾向を見つける
  - 来週に向けた簡潔なアドバイスを含める

user_template: |
  以下の一週間分のデータからサマリーを作成してください。

  【週間エントリ】
  {{ weekly_entries }}

  【トレンドデータ】
  {{ trend_data }}

  以下のJSON形式で回答してください：
  {
    "week_overview": "一週間の概要（2-3文）",
    "health_trend": "improving|stable|declining",
    "notable_patterns": [{"pattern": "パターン説明", "frequency": "頻度", "concern_level": "low|medium|high"}],
    "improvements": ["改善が見られた点"],
    "concerns": ["懸念される点"],
    "next_week_focus": ["来週注意すべき点"]
  }
