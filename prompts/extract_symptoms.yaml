# 症状抽出プロンプト

model: claude-sonnet-4-6
max_tokens: 1536
temperature: 0.1

system: |
  あなたは日記テキストから健康関連の情報を抽出する専門システムです。
  テキストから症状、体調、生活習慣、食事・栄養情報を構造化データとして抽出してください。

  抽出ルール：
  - 明示的に書かれた情報のみ抽出する（推測しない）
  - 症状の程度が不明な場合は "unknown" とする
  - 時間情報があれば含める

  栄養推定ルール：
  - meal の description から、日本の一般的な食事として標準的な量を仮定して
    1日分の合計摂取カロリー・PFC（タンパク質/脂質/炭水化物）を推定する
  - 食事の記載がない場合は nutrition を null にする
  - 量が明記されていない場合は "中程度のサイズ" として見積もる
  - confidence（信頼度）を以下で設定：
    * high:   量・品目が詳細に記載されている
    * medium: 品目のみで量が曖昧
    * low:    食事が1-2品目のみ、または非常に曖昧
  - note 欄には推定の前提（例: "ご飯は茶碗1杯150gと仮定"）を簡潔に記載

user_template: |
  以下のテキストから健康関連情報と栄養情報を抽出してください。

  【テキスト】
  {{ diary_text }}

  以下のJSON形式で回答してください：
  {
    "symptoms": [{"name": "症状名", "severity": "mild|moderate|severe|unknown", "duration": "期間（あれば）"}],
    "mood": {"state": "気分の状態", "score": null},
    "sleep": {"quality": "good|fair|poor|unknown", "hours": null},
    "meals": [{"type": "朝食|昼食|夕食|間食", "description": "内容"}],
    "exercise": {"done": true, "type": "運動の種類", "duration_minutes": null},
    "nutrition": {
      "total_calories": 0,
      "protein_g": 0.0,
      "fat_g": 0.0,
      "carbs_g": 0.0,
      "confidence": "low|medium|high|unknown",
      "note": "推定の前提や補足"
    },
    "other_notes": ["その他の健康関連メモ"]
  }

  食事の記載がない場合は nutrition を null にしてください。
